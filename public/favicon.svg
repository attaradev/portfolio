<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#0f172a"/>

  <!-- Layered architecture base - representing infrastructure -->
  <g opacity="0.2">
    <rect x="100" y="390" width="312" height="6" fill="url(#grad2)" rx="3"/>
    <rect x="120" y="360" width="272" height="6" fill="url(#grad2)" rx="3"/>
    <rect x="140" y="330" width="232" height="6" fill="url(#grad2)" rx="3"/>
  </g>

  <!-- Nkyinkyim - Winding path of resilience and journey -->
  <!-- Main zigzag ascending path representing life's journey, event-driven systems, and continuous growth -->
  <path d="M 130 320 L 190 280 L 150 240 L 210 200 L 170 160 L 230 120 L 200 90"
        stroke="url(#grad1)"
        stroke-width="14"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.7"/>

  <path d="M 382 320 L 322 280 L 362 240 L 302 200 L 342 160 L 282 120 L 312 90"
        stroke="url(#grad1)"
        stroke-width="14"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.7"/>

  <!-- Central ascending path - primary journey -->
  <path d="M 256 340 L 256 300 L 280 260 L 232 220 L 280 180 L 232 140 L 256 100 L 256 70"
        stroke="url(#grad1)"
        stroke-width="18"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Node markers along the path - milestones and systems -->
  <circle cx="256" cy="340" r="12" fill="#3b82f6"/>
  <circle cx="280" cy="260" r="10" fill="#8b5cf6" opacity="0.9"/>
  <circle cx="232" cy="220" r="11" fill="#3b82f6" opacity="0.9"/>
  <circle cx="280" cy="180" r="10" fill="#8b5cf6" opacity="0.9"/>
  <circle cx="232" cy="140" r="11" fill="#10b981" opacity="0.9"/>
  <circle cx="256" cy="70" r="16" fill="#10b981"/>

  <!-- Subtle Dwennimmen (ram horns) curves integrated at top - strength and wisdom -->
  <path d="M 220 90 Q 200 70 220 50"
        stroke="#10b981"
        stroke-width="8"
        fill="none"
        stroke-linecap="round"
        opacity="0.6"/>

  <path d="M 292 90 Q 312 70 292 50"
        stroke="#10b981"
        stroke-width="8"
        fill="none"
        stroke-linecap="round"
        opacity="0.6"/>

  <!-- Glow effect on destination node - achievement and excellence -->
  <circle cx="256" cy="70" r="28" fill="none" stroke="#10b981" stroke-width="2" opacity="0.4"/>
  <circle cx="256" cy="70" r="40" fill="none" stroke="#10b981" stroke-width="1" opacity="0.2"/>
</svg>
